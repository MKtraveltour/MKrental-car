<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日帰りツアー コース一覧 | しろみず旅行社</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #201d17;
    --indigo: #22384c;
    --indigo-deep: #16232f;
    --water: #4c8c96;
    --water-pale: #a9c9c9;
    --paper: #efe6d8;
    --paper-warm: #e6dac6;
    --moss: #5c6e4f;
    --wood: #8b6a4f;
    --stamp: #a8452e;
    --line: rgba(32, 29, 23, 0.16);
    --max-w: 1040px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Noto Sans JP", sans-serif;
    line-height: 1.9;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3 {
    font-family: "Shippori Mincho", serif;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--indigo-deep);
    margin: 0;
  }

  a { color: inherit; }
  img, svg { display: block; max-width: 100%; }

  .wrap {
    max-width: var(--max-w);
    margin: 0 auto;
    padding: 0 28px;
  }

  :focus-visible {
    outline: 2px solid var(--stamp);
    outline-offset: 3px;
  }

  .topline {
    background: var(--indigo-deep);
    color: var(--water-pale);
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    padding: 9px 0;
  }
  .topline .wrap {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px;
  }

  .page-head {
    background: linear-gradient(180deg, var(--indigo) 0%, var(--indigo-deep) 100%);
    color: var(--paper);
    padding: 64px 0 56px;
  }
  .page-head .kicker {
    font-size: 0.9rem;
    color: var(--water-pale);
    margin: 0 0 16px;
  }
  .page-head h1 {
    font-size: clamp(1.9rem, 4vw, 2.6rem);
    color: #fbf7ee;
    max-width: 20ch;
  }
  .page-head p {
    margin-top: 18px;
    color: var(--water-pale);
    max-width: 50ch;
    font-size: 0.98rem;
  }

  .course-list {
    padding: 64px 0 100px;
  }

  .course-card {
    display: grid;
    grid-template-columns: 220px 1fr auto;
    gap: 32px;
    align-items: center;
    padding: 30px 0;
    border-bottom: 1px solid var(--line);
    text-decoration: none;
    color: inherit;
  }
  .course-card:first-child { padding-top: 0; }

  .course-thumb {
    width: 220px;
    height: 140px;
    background: var(--indigo-deep);
    overflow: hidden;
  }
  .course-thumb svg { width: 100%; height: 100%; }

  .course-body .area {
    font-size: 0.8rem;
    color: var(--wood);
    margin-bottom: 8px;
  }
  .course-body h2 {
    font-size: 1.35rem;
    margin-bottom: 10px;
  }
  .course-body p {
    margin: 0;
    font-size: 0.92rem;
    color: #3a352b;
    max-width: 52ch;
  }

  .course-status {
    justify-self: end;
    white-space: nowrap;
    font-size: 0.85rem;
  }
  .status-live {
    color: var(--moss);
  }
  .status-live::before {
    content: "";
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--moss);
    margin-right: 7px;
  }
  .status-soon {
    color: var(--wood);
  }

  .course-card.is-soon {
    cursor: default;
  }
  .course-card.is-soon .course-thumb { opacity: 0.5; }
  .course-card.is-soon .course-body h2 { color: var(--wood); }
  .course-card:not(.is-soon):hover .course-body h2 { color: var(--stamp); }

  footer {
    background: var(--indigo-deep);
    color: var(--water-pale);
    padding: 30px 0;
    font-size: 0.82rem;
  }

  @media (max-width: 700px) {
    .course-card {
      grid-template-columns: 1fr;
      gap: 16px;
    }
    .course-thumb { width: 100%; height: 160px; }
    .course-status { justify-self: start; }
  }
</style>
</head>
<body>

  <div class="topline">
    <div class="wrap">
      <span>しろみず旅行社</span>
      <span>日帰りツアー コース一覧</span>
    </div>
  </div>

  <header class="page-head">
    <div class="wrap">
      <p class="kicker">日帰りツアー・レンタカー利用</p>
      <h1>行き先で選ぶ、一日の過ごし方</h1>
      <p>気になるコースを選んで、詳しい行程とおすすめの立ち寄り先を確認できます。</p>
    </div>
  </header>

  <section class="course-list">
    <div class="wrap">

      <a class="course-card" href="keihoku-miyama.html">
        <div class="course-thumb">
          <svg viewBox="0 0 220 140" xmlns="http://www.w3.org/2000/svg">
            <rect width="220" height="140" fill="#22384c"/>
            <polygon points="0,70 40,35 80,65 120,25 160,60 220,40 220,140 0,140" fill="#2c455b"/>
            <g fill="#5c6e4f">
              <polygon points="30,120 45,85 60,120"/>
              <polygon points="150,120 168,80 186,120"/>
            </g>
            <polygon points="90,120 110,100 130,120" fill="#5c4632"/>
          </svg>
        </div>
        <div class="course-body">
          <p class="area">京都市 京北・南丹市 美山</p>
          <h2>京北・美山、山ふところをめぐる一日</h2>
          <p>杉の森を抜け、茅葺きの里へ。京北エリア・美山エリアを自由に選んで巡る、レンタカー利用の日帰りコース。</p>
        </div>
        <div class="course-status status-live">公開中</div>
      </a>

      <div class="course-card is-soon">
        <div class="course-thumb">
          <svg viewBox="0 0 220 140" xmlns="http://www.w3.org/2000/svg">
            <rect width="220" height="140" fill="#22384c"/>
            <polygon points="0,90 220,70 220,140 0,140" fill="#4c8c96"/>
            <polygon points="0,100 220,85 220,140 0,140" fill="#5fa3ab"/>
            <polygon points="150,90 170,50 190,90" fill="#2c455b"/>
          </svg>
        </div>
        <div class="course-body">
          <p class="area">京都府 与謝郡 伊根町</p>
          <h2>伊根方面コース</h2>
          <p>舟屋の町並みをめぐる、伊根方面の日帰りコース。行程を準備中です。</p>
        </div>
        <div class="course-status status-soon">準備中</div>
      </div>

    </div>
  </section>

  <footer>
    <div class="wrap">
      <span>株式会社しろみず旅行社（旅行業登録番号：仮登録）</span>
    </div>
  </footer>

</body>
</html>
