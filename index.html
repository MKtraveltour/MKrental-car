<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日帰りツアー コース一覧 | しろみず旅行社</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2b2620;
    --cream: #fff6e8;
    --cream-deep: #ffedd0;
    --coral: #ff6b4a;
    --coral-deep: #e8532f;
    --teal: #21b3a4;
    --teal-deep: #17897d;
    --yellow: #ffc93c;
    --pink: #ff7fb0;
    --purple: #8b6bff;
    --line: rgba(43, 38, 32, 0.14);
    --max-w: 1040px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: "Zen Maru Gothic", "Noto Sans JP", sans-serif;
    line-height: 1.9;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3 {
    font-family: "M PLUS Rounded 1c", "Zen Maru Gothic", sans-serif;
    font-weight: 800;
    letter-spacing: 0.01em;
    color: var(--coral-deep);
    margin: 0;
  }

  a { color: inherit; }
  img, svg { display: block; max-width: 100%; }

  .wrap {
    max-width: var(--max-w);
    margin: 0 auto;
    padding: 0 28px;
  }

  :focus-visible {
    outline: 3px solid var(--purple);
    outline-offset: 3px;
  }

  .topline {
    background: var(--purple);
    color: #fff;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    padding: 10px 0;
  }
  .topline .wrap {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px;
  }

  .page-head {
    background: linear-gradient(160deg, var(--teal) 0%, var(--teal-deep) 100%);
    color: #fff;
    padding: 64px 0 56px;
  }
  .page-head .kicker {
    display: inline-block;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--teal-deep);
    background: var(--yellow);
    padding: 6px 16px;
    border-radius: 40px;
    margin: 0 0 20px;
    transform: rotate(-2deg);
  }
  .page-head h1 {
    font-size: clamp(1.9rem, 4vw, 2.6rem);
    color: #fff;
    max-width: 20ch;
    text-shadow: 3px 3px 0 rgba(0,0,0,0.12);
  }
  .page-head p {
    margin-top: 18px;
    color: #eafffb;
    max-width: 50ch;
    font-size: 0.98rem;
    font-weight: 500;
  }

  .course-list {
    padding: 64px 0 100px;
  }

  .course-card {
    display: grid;
    grid-template-columns: 220px 1fr auto;
    gap: 32px;
    align-items: center;
    padding: 24px;
    margin-bottom: 22px;
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 24px;
    box-shadow: 6px 6px 0 rgba(43,38,32,0.1);
    text-decoration: none;
    color: inherit;
  }

  .course-thumb {
    width: 220px;
    height: 140px;
    background: var(--teal-deep);
    border-radius: 16px;
    overflow: hidden;
    border: 3px solid var(--ink);
  }
  .course-thumb svg { width: 100%; height: 100%; }

  .course-body .area {
    display: inline-block;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--teal-deep);
    background: #d7f7f1;
    padding: 3px 12px;
    border-radius: 20px;
    margin-bottom: 10px;
  }
  .course-body h2 {
    font-size: 1.35rem;
    margin-bottom: 10px;
  }
  .course-body p {
    margin: 0;
    font-size: 0.92rem;
    color: #4a4238;
    max-width: 52ch;
    font-weight: 500;
  }

  .course-status {
    justify-self: end;
    white-space: nowrap;
    font-size: 0.82rem;
    font-weight: 700;
    padding: 6px 16px;
    border-radius: 20px;
  }
  .status-live {
    color: #fff;
    background: var(--coral);
  }
  .status-soon {
    color: var(--ink);
    background: var(--yellow);
  }

  .course-card.is-soon {
    cursor: default;
    box-shadow: none;
    border-style: dashed;
    background: var(--cream-deep);
  }
  .course-card.is-soon .course-thumb { opacity: 0.6; }
  .course-card.is-soon .course-body h2 { color: #8a7f6f; }
  .course-card:not(.is-soon):hover { transform: translate(-2px, -2px); box-shadow: 9px 9px 0 rgba(43,38,32,0.12); }
  .course-card:not(.is-soon):hover .course-body h2 { color: var(--coral-deep); }

  footer {
    background: var(--ink);
    color: #cfc7ba;
    padding: 30px 0;
    font-size: 0.85rem;
    font-weight: 500;
  }

  @media (max-width: 700px) {
    .course-card {
      grid-template-columns: 1fr;
      gap: 16px;
    }
    .course-thumb { width: 100%; height: 160px; }
    .course-status { justify-self: start; }
  }
</style>
</head>
<body>

  <div class="topline">
    <div class="wrap">
      <span>しろみず旅行社</span>
      <span>日帰りツアー コース一覧</span>
    </div>
  </div>

  <header class="page-head">
    <div class="wrap">
      <p class="kicker">日帰りツアー・レンタカー利用</p>
      <h1>行き先で選ぶ、一日の過ごし方</h1>
      <p>気になるコースを選んで、詳しい行程とおすすめの立ち寄り先を確認できます。</p>
    </div>
  </header>

  <section class="course-list">
    <div class="wrap">

      <a class="course-card" href="keihoku-miyama.html">
        <div class="course-thumb">
          <svg viewBox="0 0 220 140" xmlns="http://www.w3.org/2000/svg">
            <rect width="220" height="140" fill="#17897d"/>
            <polygon points="0,70 40,35 80,65 120,25 160,60 220,40 220,140 0,140" fill="#21b3a4"/>
            <g fill="#3fae6e">
              <polygon points="30,120 45,85 60,120"/>
              <polygon points="150,120 168,80 186,120"/>
            </g>
            <polygon points="90,120 110,100 130,120" fill="#ffc93c"/>
          </svg>
        </div>
        <div class="course-body">
          <p class="area">京都市 京北・南丹市 美山</p>
          <h2>京北・美山、山ふところをめぐる一日</h2>
          <p>杉の森を抜け、茅葺きの里へ。京北エリア・美山エリアを自由に選んで巡る、レンタカー利用の日帰りコース。</p>
        </div>
        <div class="course-status status-live">公開中</div>
      </a>

      <div class="course-card is-soon">
        <div class="course-thumb">
          <svg viewBox="0 0 220 140" xmlns="http://www.w3.org/2000/svg">
            <rect width="220" height="140" fill="#8b6bff"/>
            <polygon points="0,90 220,70 220,140 0,140" fill="#ff7fb0"/>
            <polygon points="0,100 220,85 220,140 0,140" fill="#ffa8ca"/>
            <polygon points="150,90 170,50 190,90" fill="#6c50e0"/>
          </svg>
        </div>
        <div class="course-body">
          <p class="area">京都府 与謝郡 伊根町</p>
          <h2>伊根方面コース</h2>
          <p>舟屋の町並みをめぐる、伊根方面の日帰りコース。行程を準備中です。</p>
        </div>
        <div class="course-status status-soon">準備中</div>
      </div>

    </div>
  </section>

  <footer>
    <div class="wrap">
      <span>株式会社しろみず旅行社（旅行業登録番号：仮登録）</span>
    </div>
  </footer>

</body>
</html>
